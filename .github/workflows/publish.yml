name: Publish to PyPI

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions: {}

jobs:
  build:
    if: github.repository == 'openai/openai-guardrails-python' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Package build code must not have access to publishing credentials.
    permissions:
      contents: read
    steps:
      - name: Verify published release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: context.ref.slice('refs/tags/'.length),
            });
            if (release.draft || !release.published_at) {
              throw new Error('Publishing requires a published GitHub Release.');
            }
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release is from main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Setup uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v5
        with:
          enable-cache: false
      - name: Install dependencies
        run: make sync
      - name: Build package
        run: uv build

      - name: Upload package distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openai-guardrails
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
